    <rect class="module" x="570" y="439" width="180" height="74" rx="15"/><circle cx="595" cy="464" r="8" fill="#555555"/><text x="613" y="470" font-size="15" font-weight="750">토지</text><text x="592" y="495" font-size="12" fill="#555555">등록 · 검색 · 이미지</text>
    <rect class="module" x="765" y="439" width="198" height="74" rx="15"/><circle cx="790" cy="464" r="8" fill="#555555"/><text x="808" y="470" font-size="15" font-weight="750">분석 · AI 보고서</text><text x="787" y="495" font-size="12" fill="#555555">개발 점수 · 가격 이력</text>
    <rect class="module" x="375" y="530" width="180" height="74" rx="15"/><circle cx="400" cy="555" r="8" fill="#555555"/><text x="418" y="561" font-size="15" font-weight="750">관심 · 신청</text><text x="397" y="586" font-size="12" fill="#555555">사업자 프로필 포함</text>
    <rect class="module" x="570" y="530" width="180" height="74" rx="15"/><circle cx="595" cy="555" r="8" fill="#555555"/><text x="613" y="561" font-size="15" font-weight="750">채팅</text><text x="592" y="586" font-size="12" fill="#555555">대화 · 메시지 · 첨부</text>
    <rect class="module" x="765" y="530" width="198" height="74" rx="15"/><circle cx="790" cy="555" r="8" fill="#444444"/><text x="808" y="561" font-size="15" font-weight="750">관리자</text><text x="787" y="586" font-size="12" fill="#555555">승인 · 문서 관리</text>
  </g>
  <text x="669" y="631" text-anchor="middle" font-size="13" fill="#555555">도메인별 Controller → Service → Repository 구조</text>

