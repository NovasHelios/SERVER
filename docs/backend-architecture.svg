<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960" role="img" aria-labelledby="title desc">
  <title id="title">HEILOUS 백엔드 아키텍처</title>
  <desc id="desc">클라이언트 요청이 Spring Boot 애플리케이션을 거쳐 도메인 모듈, 데이터 저장소 및 외부 서비스와 연결되는 구조.</desc>
  <defs>
    
    
    
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="10" refY="5" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#333333"/></marker>
    
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Noto Sans KR',sans-serif;fill:#111111}
      .small{font-size:15px;fill:#555555}.label{font-size:17px;font-weight:700}.node{fill:#fff;stroke:#D5D5D5;stroke-width:1.5}.module{fill:#FFFFFF;stroke:#C8C8C8;stroke-width:1.2}
      .line{fill:none;stroke:#333333;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1440" height="960" rx="36" fill="#FFFFFF"/>
  

  <!-- Header -->
  <g transform="translate(86 72)">
    <rect width="54" height="54" rx="17" fill="#111111"/>
    <path d="M15 35V19h24v16M20 24h14M20 29h14M20 34h8" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="72" y="23" font-size="14" font-weight="800" letter-spacing="2.2" fill="#111111">HEILOUS / PLATFORM</text>
    <text x="72" y="57" font-size="34" font-weight="800">백엔드 아키텍처</text>
  </g>
  <text x="1354" y="116" text-anchor="end" font-size="15" fill="#555555">현재 구현 기준 · 모듈형 모놀리스</text>

  <!-- Client cards -->
  <g >
    <rect class="node" x="70" y="286" width="208" height="112" rx="22"/>
    <rect x="92" y="310" width="44" height="62" rx="7" fill="#F0F0F0" stroke="#111111" stroke-width="2"/>
    <rect x="99" y="317" width="30" height="42" rx="3" fill="#FFFFFF"/><circle cx="114" cy="365" r="2.5" fill="#111111"/>
    <text class="label" x="153" y="334">클라이언트</text><text class="small" x="153" y="360">웹 · 모바일</text>
  </g>
  <g >
    <rect class="node" x="70" y="455" width="208" height="94" rx="22"/>
    <circle cx="115" cy="502" r="23" fill="#F0F0F0"/><path d="M105 506h20m-16-8h12m-12 16h12" stroke="#333333" stroke-width="2.5" stroke-linecap="round"/>
    <text class="label" x="153" y="496">운영자</text><text class="small" x="153" y="521">관리자 API</text>
  </g>

  <!-- App boundary -->
  <rect x="344" y="198" width="650" height="496" rx="30" fill="#FFFFFF" stroke="#BEBEBE" stroke-width="2" />
  <rect x="344" y="198" width="650" height="82" rx="30" fill="#F0F0F0"/>
  <path d="M344 250v30h650v-30" fill="#F0F0F0"/>
  <text x="382" y="235" font-size="13" font-weight="800" letter-spacing="1.6" fill="#111111">APPLICATION</text>
  <text x="382" y="263" font-size="22" font-weight="800">Spring Boot · Java 21</text>
  <rect x="817" y="222" width="142" height="34" rx="17" fill="#FFFFFF"/><text x="888" y="244" text-anchor="middle" font-size="13" font-weight="700" fill="#444444">단일 애플리케이션</text>

