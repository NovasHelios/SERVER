  <g >
    <rect class="node" x="1080" y="266" width="290" height="144" rx="22"/>
    <ellipse cx="1130" cy="308" rx="27" ry="10" fill="#F0F0F0" stroke="#111111" stroke-width="2"/><path d="M1103 308v45c0 6 12 11 27 11s27-5 27-11v-45m-54 15c0 6 12 11 27 11s27-5 27-11m-54 15c0 6 12 11 27 11s27-5 27-11" fill="#F0F0F0" stroke="#111111" stroke-width="2"/>
    <text x="1177" y="310" font-size="17" font-weight="800">PostgreSQL 16</text><text x="1177" y="337" font-size="14" fill="#444444">+ PostGIS</text><text x="1104" y="385" font-size="13" fill="#555555">사용자 · 토지 · 채팅 · 거래 데이터</text>
  </g>
  <g >
    <rect class="node" x="1080" y="437" width="290" height="112" rx="22"/>
    <rect x="1104" y="463" width="51" height="48" rx="10" fill="#F0F0F0"/><path d="M1116 475h27m-27 8h27m-27 8h18" stroke="#333333" stroke-width="2.5" stroke-linecap="round"/>
    <text x="1177" y="478" font-size="17" font-weight="800">Redis 7</text><text x="1177" y="505" font-size="13" fill="#555555">이메일 인증 · 재설정 코드</text>
  </g>
  <g >
    <rect class="node" x="1080" y="576" width="290" height="112" rx="22"/>
    <rect x="1104" y="602" width="51" height="48" rx="10" fill="#F0F0F0"/><path d="M1118 613h23v26h-23z m5 7h13m-13 6h13m-13 6h8" fill="none" stroke="#555555" stroke-width="2" stroke-linecap="round"/>
    <text x="1177" y="617" font-size="17" font-weight="800">파일 저장소</text><text x="1177" y="644" font-size="13" fill="#555555">현재: 앱 로컬 업로드 경로</text>
  </g>

  <!-- External services strip -->
  <rect x="70" y="760" width="1300" height="126" rx="26" fill="#FFFFFF" stroke="#D5D5D5" stroke-width="1.5" />
  <text x="105" y="797" font-size="13" font-weight="800" letter-spacing="1.3" fill="#555555">CONNECTED SERVICES</text>
  <g>
    <rect x="105" y="817" width="276" height="48" rx="14" fill="#F5F5F5"/><circle cx="130" cy="841" r="9" fill="#111111"/><text x="151" y="847" font-size="15" font-weight="700">Google · Kakao · Naver</text><text x="353" y="847" text-anchor="end" font-size="12" fill="#555555">OAuth2</text>
    <rect x="400" y="817" width="210" height="48" rx="14" fill="#F5F5F5"/><circle cx="425" cy="841" r="9" fill="#555555"/><text x="446" y="847" font-size="15" font-weight="700">SMTP 메일</text>
    <rect x="629" y="817" width="268" height="48" rx="14" fill="#F5F5F5"/><circle cx="654" cy="841" r="9" fill="#555555"/><text x="675" y="847" font-size="15" font-weight="700">VWorld · Kakao 지도</text>
    <rect x="916" y="817" width="418" height="48" rx="14" fill="#F5F5F5"/><circle cx="941" cy="841" r="9" fill="#555555"/><text x="962" y="847" font-size="15" font-weight="700">OpenAI API</text><text x="1305" y="847" text-anchor="end" font-size="12" fill="#555555">Spring AI</text>
  </g>

  <!-- Directional connectors: every arrow tip touches its destination boundary -->
  <path class="line" d="M278 342H325V336H375"/>
  <path class="line" d="M278 502H325V351H375"/>
  <path class="line" d="M514 370V396"/>
