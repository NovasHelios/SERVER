spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile

jwt:
  secret: ${JWT_SECRET}

vworld:
  api:
    key: ${VWORLD_API_KEY}
    domain: ${VWORLD_API_DOMAIN:}

kakao:
  api:
    key: ${KAKAO_REST_API_KEY}

file:
  upload:
    dir: ${FILE_UPLOAD_DIR:uploads}

oauth2:
  redirect-uri: ${OAUTH2_REDIRECT_URI}

server:
  url: ${SERVER_URL:https://localhost:8080}
  forward-headers-strategy: framework