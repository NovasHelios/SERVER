spring:
  main:
    allow-bean-definition-overriding: true

  # H2 데이터베이스 (PostgreSQL 호환 모드)
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true

  # 외부 서비스 연동 기본값 모킹
  ai:
    openai:
      api-key: test-openai-key-for-testing

  data:
    redis:
      host: localhost
      port: 6379

  mail:
    host: localhost
    port: 25

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-id
            client-secret: test-google-secret
            scope:
              - email
              - profile
          kakao:
            client-id: test-kakao-id
            client-secret: test-kakao-secret
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/kakao"
            scope:
              - profile_nickname
              - account_email
            client-name: Kakao
          naver:
            client-id: test-naver-id
            client-secret: test-naver-secret
            client-authentication-method: client_secret_post
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/naver"
            scope:
              - name
              - email
            client-name: Naver
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

jwt:
  secret: test-secret-key-for-integration-test-must-be-long-enough-32chars

vworld:
  api:
    key: test-vworld-key
    domain: localhost

kakao:
  api:
    key: test-kakao-key

file:
  upload:
    dir: /tmp/heilous-test-uploads

oauth2:
  redirect-uri: http://localhost:3000/oauth2/callback

server:
  url: http://localhost:8080
  forward-headers-strategy: framework

logging:
  level:
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG